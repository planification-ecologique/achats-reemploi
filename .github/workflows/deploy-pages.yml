name: Déploiement preview GitHub Pages

# Déploie une preview du widget carte (widget_carto.html) sur GitHub Pages.
# Ouvert hors Grist, le widget retombe sur le CSV servi à côté de lui : la preview
# affiche donc les données du POC sans avoir besoin d'un document Grist.
#
# Prérequis (une seule fois, déjà fait) : Settings → Pages → "Build and
# deployment" → Source = "GitHub Actions".

on:
  push:
    branches:
      - main
      # Branche de travail du POC — preview avant fusion. À retirer après merge.
      - claude/vibrant-faraday-7rmffy
    paths:
      - widget_carto.html
      - acteurs_reemploi_poc.csv
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

# Permissions minimales requises par le déploiement Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule preview à la fois ; on annule les déploiements en cours dépassés.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble le site (widget + données + index)
        run: |
          mkdir -p _site
          cp widget_carto.html _site/widget_carto.html
          cp acteurs_reemploi_poc.csv _site/acteurs_reemploi_poc.csv
          # index.html = copie du widget pour servir la preview à la racine
          # (le fetch du CSV reste relatif et fonctionne).
          cp widget_carto.html _site/index.html

      - name: Configure Pages
        # Prérequis : Pages doit être activé manuellement une fois par un admin
        # du dépôt (Settings → Pages → Source = « GitHub Actions »). La création
        # automatique (enablement: true) est bloquée par la politique de l'org
        # (« Resource not accessible by integration »).
        uses: actions/configure-pages@v5

      - name: Upload de l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Déploiement vers Pages
        id: deployment
        uses: actions/deploy-pages@v4
