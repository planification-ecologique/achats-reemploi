name: Déploiement Pages (prod + previews PR)

# Publie le widget carte sur GitHub Pages via la branche gh-pages :
#  - push sur main  -> site de production à la racine
#  - pull request   -> preview isolée dans pr-preview/pr-<N>/ (+ commentaire,
#                      nettoyage automatique à la fermeture de la PR)
# Ouvert hors Grist, le widget retombe sur le CSV servi à côté de lui : la
# preview affiche donc les données du POC sans document Grist.
#
# Prérequis (une seule fois) : Settings → Pages → "Build and deployment" →
# Source = "Deploy from a branch" → branche "gh-pages" / dossier "/ (root)".

on:
  push:
    branches: [main]
    paths:
      - widget_carto.html
      - acteurs_reemploi_poc.csv
      - .github/workflows/deploy-pages.yml
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - widget_carto.html
      - acteurs_reemploi_poc.csv
      - .github/workflows/deploy-pages.yml

# Le token doit pouvoir pousser sur gh-pages et commenter la PR.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble le site (widget + données + index)
        run: |
          mkdir -p _site
          cp widget_carto.html _site/widget_carto.html
          cp acteurs_reemploi_poc.csv _site/acteurs_reemploi_poc.csv
          # index.html = copie du widget pour servir la page à la racine
          # (le fetch du CSV reste relatif et fonctionne).
          cp widget_carto.html _site/index.html
          # Site statique pur : désactive le traitement Jekyll côté Pages.
          touch _site/.nojekyll

      # Production : push sur main -> racine de gh-pages, sans toucher les
      # previews (clean-exclude conserve le dossier pr-preview/).
      - name: Déploiement production (main)
        if: github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          clean-exclude: pr-preview/

      # Previews PR : crée/maj pr-preview/pr-<N>/, commente l'URL, et nettoie
      # automatiquement quand la PR est fermée/fusionnée.
      - name: Preview de la PR
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
          umbrella-dir: pr-preview

# retrigger preview deploy
